name: Build and Release PoolForge

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build Binary & MSI Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Determine Version
        id: get_version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $ver = $env:GITHUB_REF.Substring(11)
          } else {
            $cargoToml = Get-Content Cargo.toml -Raw
            if ($cargoToml -match 'version\s*=\s*"([^"]+)"') {
              $ver = $matches[1]
            } else {
              $ver = "0.1.0"
            }
          }
          Write-Host "Building PoolForge Version: $ver"
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$ver"

      - name: Build Release Binary
        shell: pwsh
        run: |
          cargo build --release --target x86_64-pc-windows-msvc

      - name: Add WiX Toolset to PATH
        shell: pwsh
        run: |
          if (Get-Command candle.exe -ErrorAction SilentlyContinue) {
            Write-Host "candle.exe is already available in PATH"
            exit 0
          }

          $wixDirs = Get-ChildItem -Path @("${env:ProgramFiles(x86)}", "${env:ProgramFiles}", "C:\Program Files (x86)", "C:\Program Files") -Filter "*WiX Toolset*" -Directory -ErrorAction SilentlyContinue
          if (-not $wixDirs) {
            Write-Host "Installing WiX Toolset via Chocolatey..."
            choco install wixtoolset -y
            $wixDirs = Get-ChildItem -Path @("${env:ProgramFiles(x86)}", "${env:ProgramFiles}", "C:\Program Files (x86)", "C:\Program Files") -Filter "*WiX Toolset*" -Directory -ErrorAction SilentlyContinue
          }

          $binPath = $null
          foreach ($wd in $wixDirs) {
            $candidate = Join-Path $wd.FullName "bin"
            if (Test-Path (Join-Path $candidate "candle.exe")) {
              $binPath = $candidate
              break
            }
          }

          if ($binPath) {
            Write-Host "Found WiX at $binPath, adding to GITHUB_PATH"
            Add-Content -Path $env:GITHUB_PATH -Value $binPath
          } elseif ($env:WIX -and (Test-Path (Join-Path $env:WIX "bin\candle.exe"))) {
            Write-Host "Found WiX via WIX env var: $env:WIX\bin"
            Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:WIX "bin")
          } else {
            Write-Host "WiX directory will be located dynamically by build_msi.ps1"
          }

      - name: Build MSI Installer
        shell: pwsh
        run: |
          .\wix\build_msi.ps1 -Version $env:VERSION -SourceDir "target\x86_64-pc-windows-msvc\release" -OutputDir "target\installer"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PoolForge-${{ env.VERSION }}-Setup
          path: target/installer/*.msi
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/installer/*.msi
          generate_release_notes: true
          draft: false
          prerelease: false
